[package]
name = "armature-config"
version = "0.3.1"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-config"
homepage = "https://quinnjr.github.io/armature"
description = "Configuration management for Armature with environment and file support"
keywords = ["config", "configuration", "environment", "settings"]
categories = ["config", "web-programming"]

[dependencies]
armature-core = { version = "0.8" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
dotenvy = "0.15"
thiserror = "2.0"

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio-test = "0.4"

